name: Capture project screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - feature/self-learning-chatbot
    paths:
      - "app/**"
      - "scripts/capture-project-screenshots.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/project-screenshots.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-project-screenshots
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/self-learning-chatbot
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Validate Next.js build
        run: npm run build

      - name: Install screenshot tooling
        run: |
          npm install --no-save --package-lock=false playwright sharp
          npx playwright install --with-deps chromium

      - name: Capture local project screenshots
        run: node scripts/capture-project-screenshots.mjs

      - name: Publish WebP screenshots on latest branch
        run: |
          rm -rf /tmp/portfolio-projects
          mkdir -p /tmp/portfolio-projects
          cp -a public/projects/. /tmp/portfolio-projects/

          git fetch origin feature/self-learning-chatbot
          git reset --hard origin/feature/self-learning-chatbot

          mkdir -p public/projects
          rm -f public/projects/*.webp
          cp -a /tmp/portfolio-projects/. public/projects/

          git config user.name "portfolio-screenshot-bot"
          git config user.email "actions@github.com"
          git add public/projects

          if git diff --cached --quiet; then
            echo "Screenshots already match the latest branch"
            exit 0
          fi

          git commit -m "chore: refresh local project screenshots"
          git push origin HEAD:feature/self-learning-chatbot
