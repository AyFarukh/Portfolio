name: Capture project screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - feature/self-learning-chatbot
    paths:
      - "scripts/capture-project-screenshots.mjs"
      - ".github/workflows/project-screenshots.yml"

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/self-learning-chatbot

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright sharp
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        run: node scripts/capture-project-screenshots.mjs

      - name: Commit screenshots
        run: |
          git config user.name "portfolio-screenshot-bot"
          git config user.email "actions@github.com"
          git add public/projects
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "chore: refresh local project screenshots"
          git push origin HEAD:feature/self-learning-chatbot
